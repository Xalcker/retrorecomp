<!doctype html>
<!--
  Página del juego recompilado en el navegador (make web). Es la misma para los cuatro recompiladores: el
  Makefile del proyecto reemplaza @TITLE@ (el nombre del juego), @PREF@ (la carpeta de datos que da
  SDL_GetPrefPath, p. ej. /libsdl/NESRecomp/smb/), @CACHE@ (la copia de la ROM que guarda el juego, p. ej.
  rom.nes) y @ACCEPT@ (las extensiones del selector, p. ej. .nes,.zip). Emscripten pone su código en
  {{{ SCRIPT }}}.

  La ROM nunca va en el build: se elige aquí (o se arrastra) y se escribe en el sistema de archivos del
  navegador; el juego guarda una copia en su carpeta de datos, que vive en IndexedDB (IDBFS) con la partida,
  los estados y las preferencias, así que la siguiente vez basta con «Jugar». Con ?rom=URL (lo usa la GUI de
  retrorecomp, que la sirve en local) «Jugar» la baja de ahí; ?args=--no-menu,--fullscreen pasa opciones.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  :root { color-scheme: dark; --fondo: #111; --texto: #ddd; --suave: #888; --borde: #333; --acento: #5a8dee; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #canvas { display: none; max-width: 100vw; max-height: 100vh; image-rendering: pixelated; outline: none; }
  #inicio { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; text-align: center; }
  #inicio h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #zona { border: 2px dashed var(--borde); border-radius: 10px; padding: 28px 36px; max-width: 420px; }
  #zona.encima { border-color: var(--acento); }
  button, label.boton { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--borde);
                        background: #222; color: var(--texto); cursor: pointer; }
  button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #estado { color: var(--suave); min-height: 1.4em; max-width: 520px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="inicio">
  <h1>@TITLE@</h1>
  <button id="jugar" class="principal" style="display:none">▶ Jugar</button>
  <div id="zona">
    <p style="margin:0 0 12px">Elige la ROM del juego (o arrástrala aquí). Se comprueba que sea la que se
      recompiló y se guarda en este navegador para la próxima vez.</p>
    <label class="boton">Elegir ROM…<input type="file" id="archivo" accept="@ACCEPT@"></label>
  </div>
  <div id="estado">Cargando…</div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  "use strict";
  var PREF = "@PREF@", CACHE = "@CACHE@";
  var $ = function (id) { return document.getElementById(id); };
  var listo = false;
  var params = new URLSearchParams(location.search);
  var romUrl = params.get("rom");
  var extra = (params.get("args") || "").split(",").filter(function (a) { return /^--[a-z-]+$/.test(a); });

  function estado(t) { $("estado").textContent = t; }

  /* Arranca el juego: oculta el inicio, muestra el lienzo y llama a main (con la ROM, o sin argumentos para
   * que use la copia guardada). Se llama desde un clic o un arrastre: así el navegador deja sonar el audio */
  function arrancar(args) {
    $("inicio").style.display = "none";
    var c = $("canvas");
    c.style.display = "block";
    c.focus();
    Module.callMain(args.concat(extra));
  }

  function cargar(archivo) {
    if (!listo || !archivo) return;
    estado("Leyendo " + archivo.name + "…");
    archivo.arrayBuffer().then(function (buf) {
      var ruta = "/" + archivo.name.replace(/[\/\\]/g, "_");
      FS.writeFile(ruta, new Uint8Array(buf));
      arrancar([ruta]);
    }, function (e) { estado("No se pudo leer " + archivo.name + ": " + e); });
  }

  $("archivo").onchange = function (e) { cargar(e.target.files[0]); };
  $("jugar").onclick = function () {
    if (!romUrl) { arrancar([]); return; }
    estado("Bajando la ROM…");
    fetch(romUrl).then(function (r) {
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      return r.blob();
    }).then(function (b) {
      cargar(new File([b], decodeURIComponent(romUrl.split("/").pop().split("?")[0]) || "rom"));
    }, function (e) { estado("No se pudo bajar la ROM: " + e.message); });
  };
  var zona = document.body;
  zona.addEventListener("dragover", function (e) { e.preventDefault(); $("zona").classList.add("encima"); });
  zona.addEventListener("dragleave", function () { $("zona").classList.remove("encima"); });
  zona.addEventListener("drop", function (e) {
    e.preventDefault();
    $("zona").classList.remove("encima");
    if ($("inicio").style.display !== "none") cargar(e.dataTransfer.files[0]);
  });

  var Module = {
    canvas: $("canvas"),
    noInitialRun: true,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    /* La carpeta de datos del juego en IndexedDB: se monta y se lee antes de arrancar */
    preRun: [function () {
      FS.mkdir("/libsdl");
      FS.mount(IDBFS, {}, "/libsdl");
      Module.addRunDependency("idbfs");
      FS.syncfs(true, function (err) {
        if (err) console.warn("IndexedDB:", err);
        Module.removeRunDependency("idbfs");
      });
    }],
    onRuntimeInitialized: function () {
      listo = true;
      var guardada = FS.analyzePath(PREF + CACHE).exists;
      $("jugar").style.display = guardada || romUrl ? "" : "none";
      estado(romUrl ? "" : guardada ? "La ROM ya está guardada en este navegador." : "");
    },
    onAbort: function (t) { estado("Error: " + t); },
  };
  /* Al cerrar la pestaña: lo último a IndexedDB (el juego también lo copia cada dos segundos) */
  window.addEventListener("pagehide", function () { if (listo) FS.syncfs(false, function () {}); });
</script>
{{{ SCRIPT }}}
</body>
</html>
