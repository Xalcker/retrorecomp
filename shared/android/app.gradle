// La app del juego recompilado (make apk, retrorecomp/shared/android). android.mk la copia a
// build/android/app/build.gradle y pasa con -P la carpeta del proyecto (recompDir), la de SDL2 (sdlDir), el juego
// (appName, appTitle, appSystem), el ícono, los -I y -D (inc) y las arquitecturas (abis).
apply plugin: 'com.android.application'

def recompDir = file(property('recompDir'))
def sdlDir = file(property('sdlDir'))
def plat = new File(recompDir, 'platform/android')

// Un nombre como parte del paquete de Android: minúsculas, dígitos y _, y empieza con letra
static String idPart(String s) {
    def p = s.toLowerCase().replaceAll('[^a-z0-9_]', '_')
    return p ==~ /[a-z].*/ ? p : 'j' + p
}

// El ícono de la ventana del proyecto es también el del teléfono: un arreglo de C (el primero del archivo, o el que
// se nombre después de ":") con un PNG (icono.h) o con los pixeles RGBA de un cuadrado (iconos.c de GBRecomp)
def iconDir = layout.buildDirectory.dir('icono').get().asFile
def iconPng = new File(iconDir, 'mipmap-xxxhdpi/ic_launcher.png')
def iconSpec = property('icon').toString().split(':')
def iconSrc = new File(recompDir, iconSpec[0])
if (!iconPng.exists() || iconPng.lastModified() < iconSrc.lastModified()) {
    def text = iconSrc.getText('UTF-8')
    int from = iconSpec.length > 1 ? text.indexOf(iconSpec[1] + '[') : 0
    if (from < 0) throw new GradleException("no está el arreglo ${iconSpec[1]} en ${iconSrc}")
    def body = text.substring(text.indexOf('{', from) + 1, text.indexOf('}', from))
    def bytes = (body =~ /0x([0-9A-Fa-f]{2})/).collect { (byte) Integer.parseInt(it[1], 16) } as byte[]
    iconPng.parentFile.mkdirs()
    if (bytes.length > 8 && bytes[1] == (byte) 'P' && bytes[2] == (byte) 'N' && bytes[3] == (byte) 'G') {
        iconPng.bytes = bytes
    } else {
        int side = (int) Math.round(Math.sqrt(bytes.length / 4))
        def img = new java.awt.image.BufferedImage(side, side, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        for (int i = 0; i < side * side; i++) {
            int r = bytes[4 * i] & 255, g = bytes[4 * i + 1] & 255, b = bytes[4 * i + 2] & 255, a = bytes[4 * i + 3] & 255
            img.setRGB(i % side, i.intdiv(side), (a << 24) | (r << 16) | (g << 8) | b)
        }
        javax.imageio.ImageIO.write(img, 'png', iconPng)
    }
}

android {
    namespace = 'io.github.xalcker.retrorecomp'
    compileSdk = 35
    buildToolsVersion = '35.0.0'
    ndkVersion = '27.3.13750724'      // del SDK (Gradle la baja si falta); no ANDROID_NDK_HOME, que puede ser otra versión

    defaultConfig {
        applicationId = "io.github.xalcker.${idPart(property('appSystem').toString())}.${idPart(property('appName').toString())}"
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = '1.0'
        resValue 'string', 'app_name', property('appTitle').toString()
        ndk {
            abiFilters(*property('abis').toString().split(','))
        }
        externalNativeBuild {
            cmake {
                arguments "-DRECOMP_DIR=${recompDir}", "-DSDL_DIR=${sdlDir}", "-DRECOMP_INC=${property('inc')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = new File(plat, 'CMakeLists.txt')
            version = '3.22.1'
        }
    }

    sourceSets.main {
        manifest.srcFile(new File(plat, 'AndroidManifest.xml'))
        java.srcDirs = [plat, new File(sdlDir, 'android-project/app/src/main/java')]
        res.srcDirs = [iconDir]
        assets.srcDirs = ['../assets']
    }

    signingConfigs {
        if (System.getenv('APK_KEYSTORE')) {
            propia {
                storeFile = recompDir.toPath().resolve(System.getenv('APK_KEYSTORE')).toFile()   // relativa al proyecto
                storePassword = System.getenv('APK_KEYSTORE_PASS')
                keyAlias = System.getenv('APK_KEY_ALIAS')
                keyPassword = System.getenv('APK_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (System.getenv('APK_KEYSTORE')) signingConfig = signingConfigs.propia
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
