name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de Python
        run: python3 -m py_compile retrorecomp_gui.py compat.py tests/contract.py tests/compat_test.py
      - name: Informe de compatibilidad gemelo en los cinco sistemas (results.json sintéticos)
        run: python3 tests/compat_test.py
      - name: La página no usa nada fuera de la biblioteca estándar ni recursos externos
        run: "! grep -E 'https?://' index.html"
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salida de sonido común (shared/player_audio.h) con una tarjeta simulada
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -o player_audio_test tests/player_audio_test.c -lm
          ./player_audio_test
  ram_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Código que el juego ejecuta desde RAM (shared/ram_code.h) sin consola
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Ishared -o ram_code_test tests/ram_code_test.c
          ./ram_code_test
  disz80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desensamblador del Z80 (shared/disz80.c) contra z80_decode, todas las instrucciones
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Ishared -Itests/stub -o disz80_test tests/disz80_test.c \
             shared/disz80.c shared/z80.c
          ./disz80_test
  comun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preferencias, entradas grabadas, opciones comunes y mezcla (settings.c, inputs.h, cli.h, audio.c) sin consola
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Ishared -Itests/stub -o comun_test \
             tests/comun_test.c shared/settings.c shared/files.c shared/audio.c -lm
          ./comun_test
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Mando en pantalla común (shared/player_touch.h) con toques simulados
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -Ishared -Itests/stub $(pkg-config --cflags sdl2) -o player_touch_test \
             tests/player_touch_test.c shared/ui_font.c shared/ui_menu.c $(pkg-config --libs sdl2) -lm
          ./player_touch_test
